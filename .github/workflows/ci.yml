name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 0, not 2 — `changeset status --since=origin/main` below needs
          # real history against main to diff, not just the last commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails the PR if it touches a non-ignored package (see
      # .changeset/config.json's own "ignore" list — apps/playground,
      # apps/docs are exempt) without adding a changeset file. Doesn't run
      # on push-to-main, since main is already merged by then.
      - name: Require a changeset
        # Skipped for the "Version Packages" PR opened by changesets/action
        # (release.yml): its whole purpose is to *consume* changesets —
        # deleting the .changeset/*.md files and bumping versions — so it
        # can never contain one, and would always fail this check.
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: pnpm exec changeset status --since=origin/main

      # Fail fast on cheap checks before spending time on the build.
      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test
